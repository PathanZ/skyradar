<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkyRadar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #00ff88;
    --green-dim: #00ff8840;
    --green-mid: #00ff8880;
    --bg: #030f07;
    --grid: #00ff8818;
    --text: #00ff88cc;
    --amber: #ffb700;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: var(--green);
    touch-action: none;
  }

  #app {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }

  /* ── RADAR SCREEN ── */
  #radarWrap {
    position: relative;
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #051a0d 0%, #020a04 70%, #000 100%);
    box-shadow: 0 0 40px #00ff8830, inset 0 0 60px #00000080;
  }

  #radarCanvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
  }

  /* ── STATUS BAR (top arc) ── */
  #statusBar {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  #statusBar .title {
    font-size: clamp(8px, 2.5vw, 11px);
    letter-spacing: 0.25em;
    color: var(--green);
    text-transform: uppercase;
    opacity: 0.7;
  }

  #statusBar .count {
    font-size: clamp(14px, 4vw, 20px);
    font-weight: bold;
    color: var(--green);
    text-shadow: 0 0 10px var(--green);
    line-height: 1.1;
  }

  /* ── BOTTOM INFO ── */
  #bottomInfo {
    position: absolute;
    bottom: 12%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  #bottomInfo .range {
    font-size: clamp(7px, 2vw, 10px);
    letter-spacing: 0.2em;
    color: var(--text);
    opacity: 0.6;
  }

  #bottomInfo .updated {
    font-size: clamp(6px, 1.8vw, 9px);
    color: var(--green-mid);
    margin-top: 2px;
  }

  /* ── SELECTED AIRCRAFT PANEL ── */
  #infoPanel {
    position: absolute;
    bottom: 19%;
    left: 50%;
    transform: translateX(-50%);
    background: #00ff8812;
    border: 1px solid #00ff8840;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: clamp(6px, 1.8vw, 9px);
    color: var(--green);
    text-align: center;
    z-index: 20;
    display: none;
    white-space: nowrap;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }

  #infoPanel .callsign {
    font-size: clamp(9px, 2.5vw, 13px);
    font-weight: bold;
    color: var(--amber);
    text-shadow: 0 0 8px var(--amber);
    letter-spacing: 0.1em;
  }

  /* ── SPLASH / PERMISSION SCREEN ── */
  #splash {
    position: absolute;
    inset: 0; border-radius: 50%;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    gap: 10px;
    padding: 20%;
    text-align: center;
  }

  #splash .logo {
    font-size: clamp(18px, 6vw, 28px);
    font-weight: bold;
    letter-spacing: 0.15em;
    color: var(--green);
    text-shadow: 0 0 20px var(--green);
  }

  #splash .sub {
    font-size: clamp(7px, 2vw, 10px);
    color: var(--text);
    letter-spacing: 0.2em;
    opacity: 0.7;
  }

  #splash .msg {
    font-size: clamp(7px, 2vw, 10px);
    color: var(--green-mid);
    line-height: 1.5;
    margin-top: 6px;
  }

  #startBtn {
    background: none;
    border: 1px solid var(--green);
    color: var(--green);
    font-family: 'Courier New', monospace;
    font-size: clamp(8px, 2.5vw, 11px);
    letter-spacing: 0.2em;
    padding: 8px 18px;
    border-radius: 3px;
    cursor: pointer;
    margin-top: 8px;
    text-shadow: 0 0 8px var(--green);
    box-shadow: 0 0 12px var(--green-dim);
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  #startBtn:active {
    background: var(--green-dim);
    box-shadow: 0 0 20px var(--green-mid);
  }

  /* ── ERROR MESSAGE ── */
  #errorMsg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-size: clamp(8px, 2.2vw, 11px);
    color: #ff4466;
    z-index: 50;
    display: none;
    padding: 0 20%;
    line-height: 1.5;
  }

  /* ── LOADING RING ── */
  #loadingRing {
    position: absolute;
    inset: 0; border-radius: 50%;
    display: none;
    align-items: center; justify-content: center;
    z-index: 40;
    pointer-events: none;
  }

  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--green-dim);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* sweep glow pulse */
  @keyframes sweepGlow {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="radarWrap">
    <canvas id="radarCanvas"></canvas>

    <div id="statusBar">
      <div class="title">AIRCRAFT</div>
      <div class="count" id="countDisplay">--</div>
    </div>

    <div id="bottomInfo">
      <div class="range" id="rangeDisplay">RANGE: 55 KM</div>
      <div class="updated" id="updatedDisplay">--</div>
    </div>

    <div id="infoPanel">
      <div class="callsign" id="panelCallsign"></div>
      <div id="panelDetails"></div>
    </div>

    <div id="loadingRing"><div class="spinner"></div></div>
    <div id="errorMsg"></div>

    <div id="splash">
      <div class="logo">SKY<br>RADAR</div>
      <div class="sub">ADS-B · LIVE</div>
      <div class="msg">Tracks aircraft<br>within 55 km</div>
      <button id="startBtn" onclick="initRadar()">SCAN ›</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const RADIUS_DEG = 0.5;          // ~55 km bounding box
const REFRESH_MS = 30000;        // 30 second refresh
const SWEEP_PERIOD = 3000;       // radar sweep rotation ms
const TRAIL_MAX = 6;             // position history dots

// ── STATE ───────────────────────────────────────────────
let userLat = null, userLon = null;
let aircraft = [];
let trails = {};                  // icao24 → [{x,y,age}]
let sweepAngle = 0;
let lastUpdate = null;
let selectedAC = null;
let animFrame = null;
let refreshTimer = null;

// ── CANVAS ──────────────────────────────────────────────
const canvas = document.getElementById('radarCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const wrap = document.getElementById('radarWrap');
  canvas.width = wrap.offsetWidth;
  canvas.height = wrap.offsetHeight;
}

// ── INIT ────────────────────────────────────────────────
function initRadar() {
  document.getElementById('splash').style.display = 'none';
  showLoading(true);

  if (!navigator.geolocation) {
    showError('Geolocation not supported on this browser.');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      fetchAircraft();
      startAnimation();
      refreshTimer = setInterval(fetchAircraft, REFRESH_MS);
    },
    err => {
      showLoading(false);
      // Fallback: Surrey BC coords
      userLat = 49.19;
      userLon = -122.85;
      showError('Location denied.<br>Using Surrey, BC.');
      setTimeout(() => {
        hideError();
        fetchAircraft();
        startAnimation();
        refreshTimer = setInterval(fetchAircraft, REFRESH_MS);
      }, 2500);
    },
    { timeout: 8000, enableHighAccuracy: false }
  );
}

// ── FETCH ────────────────────────────────────────────────
async function fetchAircraft() {
  if (!userLat) return;
  showLoading(true);

  const lamin = userLat - RADIUS_DEG;
  const lamax = userLat + RADIUS_DEG;
  const lomin = userLon - RADIUS_DEG;
  const lomax = userLon + RADIUS_DEG;

  const url = `https://opensky-network.org/api/states/all?lamin=${lamin}&lomin=${lomin}&lamax=${lamax}&lomax=${lomax}`;
  const auth = 'Basic ' + btoa('pathanzaid3746@gmail.com:Claude$221b_OS');

  try {
    const res = await fetch(url, {
      signal: AbortSignal.timeout(10000),
      headers: { 'Authorization': auth }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    parseAircraft(data.states || []);
    lastUpdate = new Date();
    updateHUD();
  } catch (e) {
    if (aircraft.length === 0) {
      showError('API unavailable.<br>Retrying…');
      setTimeout(hideError, 3000);
    }
  } finally {
    showLoading(false);
  }
}

function parseAircraft(states) {
  aircraft = states
    .filter(s => s[6] != null && s[5] != null) // must have lat/lon
    .map(s => ({
      icao24:   s[0] || '??????',
      callsign: (s[1] || '').trim() || null,
      lon:      s[5],
      lat:      s[6],
      altitude: s[7] != null ? Math.round(s[7]) : null,   // meters baro
      velocity: s[9] != null ? Math.round(s[9] * 1.944) : null, // kt
      heading:  s[10] != null ? s[10] : null,
      onGround: s[8] || false,
    }))
    .filter(a => !a.onGround);

  // Update trails
  aircraft.forEach(a => {
    const pt = worldToScreen(a.lat, a.lon);
    if (!trails[a.icao24]) trails[a.icao24] = [];
    trails[a.icao24].push({ x: pt.x, y: pt.y, age: 0 });
    if (trails[a.icao24].length > TRAIL_MAX)
      trails[a.icao24].shift();
  });

  // Age existing trails
  Object.keys(trails).forEach(id => {
    trails[id].forEach(p => p.age++);
    // Remove stale trails (aircraft gone)
    if (!aircraft.find(a => a.icao24 === id))
      delete trails[id];
  });
}

// ── COORD → SCREEN ───────────────────────────────────────
function worldToScreen(lat, lon) {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r  = canvas.width / 2 * 0.82; // usable radar radius
  const dx = (lon - userLon) / RADIUS_DEG;
  const dy = (lat - userLat) / RADIUS_DEG;
  return {
    x: cx + dx * r,
    y: cy - dy * r
  };
}

// ── DRAW ─────────────────────────────────────────────────
let lastTime = 0;

function startAnimation() {
  resizeCanvas();
  function loop(ts) {
    const dt = ts - lastTime;
    lastTime = ts;
    sweepAngle = (sweepAngle + (2 * Math.PI * dt / SWEEP_PERIOD)) % (2 * Math.PI);
    draw();
    animFrame = requestAnimationFrame(loop);
  }
  animFrame = requestAnimationFrame(loop);
}

function draw() {
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const maxR = w / 2;
  const radarR = maxR * 0.82;

  ctx.clearRect(0, 0, w, h);

  // Clip to circle
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, maxR, 0, Math.PI * 2);
  ctx.clip();

  // ── Range rings ──
  [0.33, 0.66, 1].forEach((f, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, radarR * f, 0, Math.PI * 2);
    ctx.strokeStyle = i === 2 ? '#00ff8830' : '#00ff8818';
    ctx.lineWidth = i === 2 ? 1 : 0.5;
    ctx.stroke();
  });

  // ── Cross hairs ──
  ctx.strokeStyle = '#00ff8814';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(cx, cy - radarR); ctx.lineTo(cx, cy + radarR); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - radarR, cy); ctx.lineTo(cx + radarR, cy); ctx.stroke();

  // ── Ring labels ──
  ctx.fillStyle = '#00ff8850';
  ctx.font = `${Math.max(7, w * 0.025)}px 'Courier New'`;
  ctx.textAlign = 'center';
  ctx.fillText('18km', cx, cy - radarR * 0.33 - 3);
  ctx.fillText('37km', cx, cy - radarR * 0.66 - 3);

  // ── Sweep ──
  const sweepLen = radarR;
  const grad = ctx.createConicalGradient
    ? null // fallback below
    : null;

  // Sweep trail (glow sector)
  ctx.save();
  ctx.translate(cx, cy);
  for (let i = 0; i < 40; i++) {
    const a = sweepAngle - (i * 0.045);
    const alpha = (1 - i / 40) * 0.18;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, sweepLen, a - 0.045, a);
    ctx.fillStyle = `rgba(0,255,136,${alpha})`;
    ctx.fill();
  }
  // Sweep line
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(Math.cos(sweepAngle) * sweepLen, Math.sin(sweepAngle) * sweepLen);
  ctx.strokeStyle = '#00ff88cc';
  ctx.lineWidth = 1.5;
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 6;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.restore();

  // ── Center dot ──
  ctx.beginPath();
  ctx.arc(cx, cy, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#00ff88';
  ctx.shadowColor = '#00ff88';
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;

  // ── N indicator ──
  ctx.fillStyle = '#00ff8880';
  ctx.font = `bold ${Math.max(8, w * 0.028)}px 'Courier New'`;
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy - radarR * 0.92);

  // ── Aircraft trails ──
  Object.entries(trails).forEach(([id, pts]) => {
    pts.forEach((pt, i) => {
      if (i === pts.length - 1) return; // skip last (drawn as blip)
      const alpha = (i / pts.length) * 0.3;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,255,136,${alpha})`;
      ctx.fill();
    });
  });

  // ── Aircraft blips ──
  aircraft.forEach(a => {
    const pt = worldToScreen(a.lat, a.lon);
    const isSelected = selectedAC && a.icao24 === selectedAC.icao24;
    const inSweep = isInSweepZone(a.lat, a.lon);

    // Glow when sweep passes
    if (inSweep) {
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,255,136,0.12)';
      ctx.fill();
    }

    // Blip
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, isSelected ? 5 : 3.5, 0, Math.PI * 2);
    ctx.fillStyle = isSelected ? '#ffb700' : (inSweep ? '#00ff88' : '#00cc66');
    ctx.shadowColor = isSelected ? '#ffb700' : '#00ff88';
    ctx.shadowBlur = isSelected ? 12 : (inSweep ? 8 : 4);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Heading tick
    if (a.heading != null) {
      const rad = (a.heading - 90) * Math.PI / 180;
      const tl = 8;
      ctx.beginPath();
      ctx.moveTo(pt.x, pt.y);
      ctx.lineTo(pt.x + Math.cos(rad) * tl, pt.y + Math.sin(rad) * tl);
      ctx.strokeStyle = isSelected ? '#ffb70099' : '#00ff8866';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  });

  ctx.restore(); // end clip
}

function isInSweepZone(lat, lon) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const pt = worldToScreen(lat, lon);
  const angle = Math.atan2(pt.y - cy, pt.x - cx);
  let diff = ((sweepAngle - angle) + Math.PI * 2) % (Math.PI * 2);
  return diff < 0.4;
}

// ── TAP TO SELECT ────────────────────────────────────────
document.getElementById('radarWrap').addEventListener('click', e => {
  if (aircraft.length === 0) return;
  const rect = canvas.getBoundingClientRect();
  const tx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const ty = (e.clientY - rect.top) * (canvas.height / rect.height);

  let closest = null, minDist = 20;
  aircraft.forEach(a => {
    const pt = worldToScreen(a.lat, a.lon);
    const d = Math.hypot(pt.x - tx, pt.y - ty);
    if (d < minDist) { minDist = d; closest = a; }
  });

  selectedAC = closest;
  updateInfoPanel();
});

function updateInfoPanel() {
  const panel = document.getElementById('infoPanel');
  if (!selectedAC) { panel.style.display = 'none'; return; }
  const a = selectedAC;
  document.getElementById('panelCallsign').textContent = a.callsign || a.icao24.toUpperCase();
  const alt = a.altitude != null ? `${Math.round(a.altitude * 3.281)}ft` : '---';
  const spd = a.velocity != null ? `${a.velocity}kt` : '---';
  const hdg = a.heading != null ? `${Math.round(a.heading)}°` : '---';
  document.getElementById('panelDetails').textContent = `${alt} · ${spd} · ${hdg}`;
  panel.style.display = 'block';
  setTimeout(() => { if (selectedAC === a) { selectedAC = null; updateInfoPanel(); } }, 4000);
}

// ── HUD ──────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('countDisplay').textContent = aircraft.length;
  if (lastUpdate) {
    const t = lastUpdate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('updatedDisplay').textContent = `UPD ${t}`;
  }
}

// ── HELPERS ──────────────────────────────────────────────
function showLoading(v) {
  document.getElementById('loadingRing').style.display = v ? 'flex' : 'none';
}
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.innerHTML = msg; el.style.display = 'block';
}
function hideError() {
  document.getElementById('errorMsg').style.display = 'none';
}

window.addEventListener('resize', () => { resizeCanvas(); });
resizeCanvas();
</script>
</body>
</html>
